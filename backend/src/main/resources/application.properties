spring.application.name=BankEase

# Local development override (optional, git-ignored)
spring.config.import=optional:file:./application-local.properties,optional:file:../application-local.properties,optional:classpath:application-local.properties

# Server Port (Render uses $PORT, defaults to 8080)
server.port=${PORT:8080}

# MySQL Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
cors.frontend-url=${FRONTEND_URL:}

